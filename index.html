<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My First Telegram Mini App</title>
    <!-- Include the official Telegram WebApp JavaScript SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            /* Telegram automatically provides CSS variables to match the user's theme (dark/light) */
            background-color: var(--tg-theme-bg-color, #ffffff);
            color: var(--tg-theme-text-color, #000000);
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            text-align: center;
            padding: 20px;
        }
        button {
            background-color: var(--tg-theme-button-color, #2481cc);
            color: var(--tg-theme-button-text-color, #ffffff);
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            margin-top: 15px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Hello, <span id="username">User</span>!</h1>
        <p>Welcome to your first Telegram Mini App.</p>
        <button id="main-btn">Send Alert</button>
    </div>

    <script>
        // Initialize the Telegram WebApp object
        const tg = window.Telegram.WebApp;

        // Tell Telegram the app is ready
        tg.ready();

        // Expand the app to take up the maximum available height
        tg.expand();

        // Fetch the user's name from Telegram's initData
        if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
            document.getElementById('username').innerText = tg.initDataUnsafe.user.first_name;
        }

        // Handle button click using Telegram's native alert popup
        document.getElementById('main-btn').addEventListener('click', () => {
            tg.showAlert("You clicked the button inside the Mini App!");
        });
    </script>
</body>
</html>
